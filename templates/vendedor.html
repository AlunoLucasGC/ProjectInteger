<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feira Fácil — Painel do Produtor</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Vinculação do mesmo CSS customizado -->
    <link rel="stylesheet" href="../static/estilo.css">
</head>
<body class="bg-creme">

    <!-- Topo Minimalista do Painel -->
    <header class="main-header bg-white sticky-top border-bottom py-3 px-3">
        <div class="container-fluid max-width-container p-0 d-flex align-items-center justify-content-between">
            <div class="profile-area d-flex align-items-center gap-2">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Foto do Produtor" class="profile-pic rounded-circle">
                <div class="profile-text d-flex flex-column">
                    <span class="greeting text-uppercase tracking-wider">Painel do Produtor</span>
                    <strong class="user-name">Isaias Martins</strong>
                </div>
            </div>
            <span class="badge rounded-pill bg-verde-tag px-3 py-2 text-uppercase fw-semibold tracking-wider header-status">Sítio Ativo</span>
        </div>
    </header>

    <!-- Conteúdo Centralizado do Painel -->
    <main class="container-fluid max-width-container p-3 d-flex flex-column align-items-center panel-wrapper">
        
        <!-- Boas-vindas / Status Breve -->
        <div class="text-center my-4 inner-header-panel">
            <h2 class="fw-bold fs-4 text-verde-safari mb-1">O que vamos fazer hoje?</h2>
            <p class="text-muted small">Gerencie suas colheitas e vendas em poucos cliques.</p>
        </div>

        <!-- Bloco de Ações Principais -->
        <div class="w-100 d-flex flex-column gap-3 max-width-buttons mb-5">
            
            <!-- Botão 1: Anunciar Manualmente -->
            <button class="btn btn-panel-primary w-100 py-3 rounded-4 fw-semibold shadow-sm d-flex align-items-center justify-content-center gap-2">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Anunciar produto manualmente
            </button>

            <!-- Botão 2: Meus Produtos -->
            <button class="btn btn-panel-secondary w-100 py-3 rounded-4 fw-semibold shadow-sm d-flex align-items-center justify-content-center gap-2">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                Meus produtos
            </button>

        </div>
    </main>

    <!-- CONTAINER INFERIOR FIXO: Substitui a antiga navbar pelo Anúncio Automático (Câmera) -->
    <div class="fixed-bottom-action position-fixed start-0 end-0 px-3 z-3 w-100 text-center">
        <div class="camera-panel-container mx-auto d-flex flex-column align-items-center justify-content-center p-3 rounded-4 shadow-lg">
            
            <!-- Botão Tipo Câmera -->
            <button class="btn btn-camera rounded-circle d-flex align-items-center justify-content-center shadow mb-2" aria-label="Anunciar automaticamente por foto">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
            </button>
            
            <span class="fw-bold text-white fs-6 mb-1">Anunciar automaticamente</span>
            <p class="text-white-50 small px-3 mb-0 text-max-width">Tire uma foto do seu produto e nós fazemos o resto.</p>
        </div>
    </div>

</body>
</html>
